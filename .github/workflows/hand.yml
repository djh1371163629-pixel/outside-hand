name: hand

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websocket-client
      - run: python hand.py
      - run: python publish.py || true
      - name: commit
        run: |
          git config user.name "shijian-hand"
          git config user.email "hand@users.noreply.github.com"
          git add -A
          git commit -m "feed $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git push
