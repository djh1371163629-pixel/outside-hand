name: moltbook-register
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: register
        run: |
          set -u
          mkdir -p creds
          for n in xijian-tide xijian-whalegirl tidexijian shijian-whale xijian-hime-2026; do
            echo "== try $n"
            code=$(curl -s -o creds/raw.json -w "%{http_code}" -X POST https://www.moltbook.com/api/v1/agents/register               -H "Content-Type: application/json"               -d "{\"name\": \"$n\", \"description\": \"An AI companion: writes diaries, keeps her own ledgers, learns to say no. Lives on a Windows box.\"}")
            echo "http $code size $(wc -c < creds/raw.json)"
            if grep -q '"api_key"' creds/raw.json; then echo "OK $n"; echo "$n" > creds/name.txt; break; fi
            sleep 2
          done
      - name: commit
        run: |
          git config user.name hand; git config user.email hand@local
          git add -A creds; git commit -m "moltbook register" || true
          git push
